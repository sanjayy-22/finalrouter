[project]
name = "finalrouter"
version = "0.1.0"
description = "Adaptive LLM model routing using contextual bandits (LinUCB) with feedback"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
service = ["fastapi>=0.110", "uvicorn>=0.29"]
test = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
